{% set sel = 'h-8 pl-2 pr-7 rounded-lg bg-surface border text-xs focus:outline-none focus:ring-2 focus:ring-accent/40 appearance-none' %}
<form method="post" action="/university/{{ u.normalized_name|urlencode }}/tier"
      class="inline-flex items-center gap-1.5">
  {% set cur = uni_tier or '' %}
  <select name="tier" onchange="this.form.submit()"
          class="{{ sel }} {{ 'border-green-400/60 text-green-700 dark:text-green-300' if cur == 'S' else 'border-sky-400/60 text-sky-700 dark:text-sky-300' if cur == 'A' else 'border-amber-400/60 text-amber-700 dark:text-amber-300' if cur == 'B' else 'border-line text-muted' }}">
    <option value="" {{ 'selected' if not cur }}>Tier: none</option>
    {% for t in ['S', 'A', 'B'] %}
      {% set s = TIER_STYLES[t] %}
      <option value="{{ t }}" {{ 'selected' if cur == t }}>{{ t }} — {{ s[4] }}</option>
    {% endfor %}
  </select>
  <noscript><button type="submit" class="h-8 px-2 rounded-lg bg-accent text-white text-xs">Set</button></noscript>
</form>
